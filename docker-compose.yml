services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
  mongo-express:
    container_name: mongo-express
    image: mongo-express:latest
    restart: always
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
      - ME_CONFIG_BASICAUTH=false
    ports:
      - "8081:8081"
